<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendulum Automation — Coming Soon</title>
<meta name="description" content="Reliable RPA for booking and finance operations. Currently being calibrated.">

<link rel="icon" type="image/png" href="resources/favicon.png">
<link rel="apple-touch-icon" href="resources/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">

<style>
:root {
  --ink:       oklch(93% 0.009 80);
  --ink-dim:   oklch(70% 0.014 263);
  --ink-mute:  oklch(58% 0.016 263);
  --amber:     oklch(72% 0.160 65);
  --amber-hi:  oklch(83% 0.140 65);

  --ff-display: 'Cormorant', Georgia, serif;
  --ff-body:    'DM Sans', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: var(--ff-body);
  background: black;
  color: var(--ink);
  overflow: hidden;
}

/* ── SHADER CANVAS ── */
#shader-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
  background: black;
}

/* ── SCRIM ── */
.scrim {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(0,0,0,0.65) 0%, transparent 100%);
  z-index: 5;
  pointer-events: none;
}

/* ── OVERLAY ── */
.overlay {
  position: fixed;
  inset: 0;
  display: grid;
  grid-template-rows: 1fr auto;
  align-items: center;
  padding: 3rem 2rem;
  z-index: 10;
}

main {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 0;
}

/* ── EYEBROW ── */
.status {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 1.5rem;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--amber);
  animation: pulse 2.6s ease-in-out infinite;
  flex-shrink: 0;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.35; }
}

@media (prefers-reduced-motion: reduce) {
  .status-dot { animation: none; }
}

/* ── HEADING ── */
h1 {
  font-family: var(--ff-display);
  font-size: clamp(3rem, 7vw, 5rem);
  font-weight: 600;
  font-style: italic;
  line-height: 1.08;
  letter-spacing: 0.01em;
  color: var(--ink);
  margin-bottom: 1.5rem;
  text-shadow: 0 2px 24px rgba(0,0,0,0.6);
}

h1 span {
  color: var(--amber);
  font-style: italic;
}

/* ── DESCRIPTION ── */
.desc {
  font-size: 1rem;
  line-height: 1.75;
  color: var(--ink-dim);
  max-width: 46ch;
  margin-bottom: 0;
  text-shadow: 0 1px 12px rgba(0,0,0,0.5);
}

/* ── FOOTER ── */
footer {
  text-align: center;
  font-size: 0.78rem;
  color: var(--ink-mute);
  padding-top: 1.5rem;
  letter-spacing: 0.01em;
}
</style>
</head>
<body>

<canvas id="shader-canvas"></canvas>
<div class="scrim" aria-hidden="true"></div>

<div class="overlay">
  <main>

    <p class="status">
      <span class="status-dot" aria-hidden="true"></span>
      Under construction
    </p>

    <h1>Currently being <span>calibrated.</span></h1>

    <p class="desc">
      Pendulum Automation delivers production-grade RPA for booking
      and finance operations. Fixed build fee. Monthly retainer.
      Owned outcomes and an SLA to back them.
    </p>

  </main>

  <footer>
    <p>&copy; 2026 Pendulum Automation</p>
  </footer>
</div>

<script>
(function () {
  'use strict';

  const VERT_SRC = `#version 300 es
precision highp float;
in vec4 position;
void main(){gl_Position=position;}`;

  const FRAG_SRC = `#version 300 es
/*
 * Shader by Matthias Hurrle (@atzedent)
 */
precision highp float;
out vec4 O;
uniform vec2 resolution;
uniform float time;
#define FC gl_FragCoord.xy
#define T time
#define R resolution
#define MN min(R.x,R.y)
float rnd(vec2 p){
  p=fract(p*vec2(12.9898,78.233));
  p+=dot(p,p+34.56);
  return fract(p.x*p.y);
}
float noise(in vec2 p){
  vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
  float a=rnd(i),b=rnd(i+vec2(1,0)),c=rnd(i+vec2(0,1)),d=rnd(i+1.);
  return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);
}
float fbm(vec2 p){
  float t=.0,a=1.;mat2 m=mat2(1.,-.5,.2,1.2);
  for(int i=0;i<5;i++){t+=a*noise(p);p*=2.*m;a*=.5;}
  return t;
}
float clouds(vec2 p){
  float d=1.,t=.0;
  for(float i=.0;i<3.;i++){
    float a=d*fbm(i*10.+p.x*.2+.2*(1.+i)*p.y+d+i*i+p);
    t=mix(t,d,a);d=a;p*=2./(i+1.);
  }
  return t;
}
void main(void){
  vec2 uv=(FC-.5*R)/MN,st=uv*vec2(2,1);
  vec3 col=vec3(0);
  float bg=clouds(vec2(st.x+T*.5,-st.y));
  uv*=1.-.3*(sin(T*.2)*.5+.5);
  for(float i=1.;i<12.;i++){
    uv+=.1*cos(i*vec2(.1+.01*i,.8)+i*i+T*.5+.1*uv.x);
    vec2 p=uv;
    float d=length(p);
    col+=.00125/d*(cos(sin(i)*vec3(1,2,3))+1.);
    float b=noise(i+p+bg*1.731);
    col+=.002*b/length(max(p,vec2(b*p.x*.02,p.y)));
    col=mix(col,vec3(bg*.25,bg*.137,bg*.05),d);
  }
  O=vec4(col,1);
}`;

  const canvas = document.getElementById('shader-canvas');
  const gl = canvas.getContext('webgl2');

  if (!gl) {
    // WebGL2 not supported — fall back to plain dark background
    document.body.style.background = 'oklch(11% 0.018 263)';
    return;
  }

  let program = null;
  let vs = null;
  let fs = null;
  let buffer = null;
  let uniforms = {};

  function compileShader(type, src) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, src);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      console.error('Shader error:', gl.getShaderInfoLog(shader));
      gl.deleteShader(shader);
      return null;
    }
    return shader;
  }

  function setup() {
    vs = compileShader(gl.VERTEX_SHADER, VERT_SRC);
    fs = compileShader(gl.FRAGMENT_SHADER, FRAG_SRC);
    if (!vs || !fs) return false;

    program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);

    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      console.error('Program link error:', gl.getProgramInfoLog(program));
      return false;
    }

    buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, 1, -1, -1, 1, 1, 1, -1]), gl.STATIC_DRAW);

    const pos = gl.getAttribLocation(program, 'position');
    gl.enableVertexAttribArray(pos);
    gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

    uniforms.resolution  = gl.getUniformLocation(program, 'resolution');
    uniforms.time        = gl.getUniformLocation(program, 'time');

    return true;
  }

  function resize() {
    const dpr = Math.max(1, 0.5 * window.devicePixelRatio);
    canvas.width  = window.innerWidth  * dpr;
    canvas.height = window.innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
  }

  let rafId;
  function render(now) {
    if (!program) return;
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(program);
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
    gl.uniform1f(uniforms.time, now * 1e-3);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    rafId = requestAnimationFrame(render);
  }

  if (setup()) {
    resize();
    window.addEventListener('resize', resize);
    rafId = requestAnimationFrame(render);
  }
})();
</script>

</body>
</html>
